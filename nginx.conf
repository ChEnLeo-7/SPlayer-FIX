map $http_x_forwarded_proto $splayer_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  gzip on;
  listen       25884;
  listen  [::]:25884;
  server_name  localhost;
  client_max_body_size 100M;

  location = /index.html {
    root      /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    root      /usr/share/nginx/html;
    index     index.html;
    try_files $uri $uri/ /index.html;
  }

  location @rewrites {
    rewrite ^(.*)$ /index.html last;
  }

  location = /api/splayer/sync/events {
    gzip off;
    proxy_http_version      1.1;
    proxy_buffering         off;
    proxy_cache             off;
    proxy_read_timeout      1h;
    proxy_set_header        Connection "";
    proxy_set_header        Host $http_host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $splayer_forwarded_proto;
    proxy_pass              http://127.0.0.1:25886;
  }

  location /api/splayer/ {
    proxy_set_header        Host $http_host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $splayer_forwarded_proto;
    proxy_pass              http://127.0.0.1:25886;
  }

  location = /api/netease/song/url/v1 {
    proxy_buffers           16 64k;
    proxy_buffer_size       128k;
    proxy_busy_buffers_size 256k;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_set_header        X-NginX-Proxy true;
    proxy_hide_header       Set-Cookie;
    include                 /etc/nginx/snippets/netease-playback-cookie.conf;
    proxy_pass              http://localhost:3000/song/url/v1;
  }

  location = /api/netease/song/url {
    proxy_buffers           16 64k;
    proxy_buffer_size       128k;
    proxy_busy_buffers_size 256k;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_set_header        X-NginX-Proxy true;
    proxy_hide_header       Set-Cookie;
    include                 /etc/nginx/snippets/netease-playback-cookie.conf;
    proxy_pass              http://localhost:3000/song/url;
  }

  location /api/netease/ {
    proxy_buffers           16 64k;
    proxy_buffer_size       128k;
    proxy_busy_buffers_size 256k;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_set_header        X-NginX-Proxy true;
    proxy_pass              http://localhost:3000/;
  }

  location /api/local-favorites/ {
    proxy_buffers           16 64k;
    proxy_buffer_size       128k;
    proxy_busy_buffers_size 256k;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_pass              http://localhost:25885/local-favorites/;
  }

  location = /api/unblock {
    return 404;
  }

  location ^~ /api/unblock/ {
    return 404;
  }

  location /music/unblock/ {
    return 410;
  }

  location /music/proxy {
    return 410;
  }
}
