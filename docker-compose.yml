services:
  SPlayer:
    build:
      context: .
    image: splayer
    container_name: SPlayer
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./data:/data/splayer
    ports:
      - 25884:25884
      - 16300:3000
      - 16380:80
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:25884/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    environment:
      # 所有变量都不是必填项
      # 网易云服务端 IP, 可在宿主机通过 ping music.163.com 获得
      #- NETEASE_SERVER_IP=220.197.30.65
      # UnblockNeteaseMusic 使用的音源, 支持列表见 https://github.com/UnblockNeteaseMusic/server?tab=readme-ov-file#%E9%9F%B3%E6%BA%90%E6%B8%85%E5%8D%95
      - UNBLOCK_SOURCES=pyncmd bodian kuwo
      # 可添加 UnblockNeteaseMusic 支持的任何环境变量, 支持列表见 https://github.com/UnblockNeteaseMusic/server?tab=readme-ov-file#%E7%8E%AF%E5%A2%83%E5%8F%98%E9%87%8F
      - ENABLE_FLAC=true
      - ENABLE_HTTPDNS=false
      - BLOCK_ADS=true
      - DISABLE_UPGRADE_CHECK=true
      - DEVELOPMENT=false
      - FOLLOW_SOURCE_ORDER=true
      - JSON_LOG=false
      - NO_CACHE=false
      - SELECT_MAX_BR=true
      - LOG_LEVEL=debug
      - SEARCH_ALBUM=true
    networks:
      - shared-net

networks:
  shared-net:
    external: true
