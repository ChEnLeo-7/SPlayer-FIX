services:
  SPlayer:
    build:
      context: .
    image: splayer
    container_name: SPlayer
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./data:/data/splayer
      - ./releases:/usr/share/nginx/html/downloads:ro
    ports:
      - 25884:25884
      - 16300:3000
      - 16380:16380
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:25884/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    environment:
      # 所有变量都不是必填项
      # 允许通过局域网 HTTP 使用 SPlayer 账户；公网部署建议改为 false
      - SPLAYER_ALLOW_INSECURE_HTTP=true
      # 为 Music Together 提供严格限域的 UNM HTTP 代理
      - SPLAYER_MUSIC_TOGETHER_UNM_ENABLED=true
      - SPLAYER_MUSIC_TOGETHER_UNM_SOURCES=pyncmd bodian kuwo
      # 如需歌曲解析专用 Cookie，按 docs/guide.md 创建 Secret 后取消以下注释
      # - SPLAYER_NETEASE_PLAYBACK_COOKIE_FILE=/run/secrets/netease_playback_cookie
    # secrets:
    #   - netease_playback_cookie
    networks:
      - shared-net

networks:
  shared-net:
    external: true

# secrets:
#   netease_playback_cookie:
